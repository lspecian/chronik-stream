[package]
name = "chronik-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified Chronik Stream server - Kafka-compatible streaming platform"

[[bin]]
name = "chronik-server"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
# Core Chronik dependencies
chronik-common = { path = "../chronik-common" }
chronik-protocol = { path = "../chronik-protocol" }
chronik-storage = { path = "../chronik-storage" }
chronik-wal = { path = "../chronik-wal" }
# chronik-ingest removed - code moved directly into chronik-server
chronik-monitoring = { path = "../chronik-monitoring" }
chronik-config = { path = "../chronik-config" }  # Required for cluster configuration

# v2.2.22: Columnar storage and embeddings for Unified API
chronik-columnar = { path = "../chronik-columnar" }
chronik-embeddings = { path = "../chronik-embeddings" }

# Agent Memory — AM-1.7: server-internal implementation of /memory/v1/* endpoints.
#
# Optional, behind the `memory` feature. chronik-memory is a Kafka *client*: it
# opens an rdkafka producer/admin and several StreamConsumer groups against a
# bootstrap address (see crates/chronik-memory/src/client.rs). Linking it into
# the broker pulls librdkafka (a C library) into a binary that already speaks the
# Kafka protocol natively — which is what breaks the static musl target, since
# librdkafka does not cross-compile against musl without a vendored zlib/OpenSSL
# and glibc-only FORTIFY_SOURCE stubs.
#
# The release musl job therefore builds --no-default-features --features search.
# Remove this dependency once /memory/v1/* is served through the broker's internal
# produce/fetch handlers instead of a loopback Kafka client.
chronik-memory = { path = "../chronik-memory", optional = true }
# O-0 Ontology (roadmap §9 / AD-1: a layer ON Chronik, mounted under
# /ontology/v1/*). Dogfoods the memory domain, so it rides the `memory` feature.
chronik-ontology = { path = "../chronik-ontology", optional = true }

# Query orchestration (Phase 9)
chronik-query = { path = "../chronik-query" }

# Optional components (feature-gated)
chronik-search = { path = "../chronik-search", optional = true }
tantivy = { workspace = true, optional = true }  # Used by query_handler for text search

# Raft consensus (v2.2.7 - metadata coordination only, NOT data replication)
chronik-raft = { path = "../chronik-raft" }
raft = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
slog = { workspace = true }
slog-stdlog = { workspace = true }

# HTTP admin API (v2.2.7 - cluster management)
axum = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls-manual-roots-no-provider"] }

# Core dependencies
tokio = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# CLI
clap = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
byteorder = { workspace = true }
base64 = "0.22"
toml = "0.8"  # For cluster config parsing

# Utils
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
async-trait = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
crc32fast = "1.4"  # CRC32 checksums for WAL replication frames
crc32c = "0.6"  # Kafka CRC-32C (Castagnoli) — control-batch CRC sanitization in fetch
arc-swap = "1.7"  # Lock-free atomic pointer swapping for metadata state machine (v2.2.7 deadlock fix)

# Socket configuration

# TLS for Kafka Protocol
tokio-rustls = { workspace = true }
rustls = { workspace = true }
subtle = { workspace = true }
# SQL per-table authorization resolves the tables a statement reads with
# DataFusion's own resolver rather than a regex (unified_api::sql_authz).
datafusion = "55"

# Force vendored OpenSSL for musl builds
openssl = { workspace = true }

# CLI table formatting

# Metrics handled by chronik-monitoring dependency


[features]
# Agent memory is OFF by default. It pulls chronik-memory -> rdkafka -> librdkafka
# (a Kafka *client* C library) into the broker, which is what broke the static
# musl release build at v2.7.0. Memory is an unproven add-on; the core streaming
# engine must never again be taxed by it. Opt in with --features memory (or build
# the sidecar worker), and only on glibc targets. See docs/ROADMAP_MEMORY_EMBEDDED.md
# for the in-process path that would let memory return to default without librdkafka.
default = ["search"]
search = ["dep:chronik-search", "dep:tantivy"]
# Deprecated, no-op; DR is metadata_dr (catalog and local metadata images in the
# object store, CHRONIK_DR_RESTORE). Kept for one release so builds passing
# `--features backup` keep working.
backup = []
# Agent Memory (/memory/v1/*). Pulls in librdkafka; incompatible with the static
# musl target. Off by default; enable explicitly on glibc builds only.
memory = ["dep:chronik-memory", "dep:chronik-ontology"]
full = ["search", "memory"]

# Minimal build without optional features (Raft is always included)
minimal = []

[dev-dependencies]
tempfile = { workspace = true }
rcgen = "0.13"

[lints]
workspace = true
