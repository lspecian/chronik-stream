[package]
name = "chronik-operator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kubernetes operator for Chronik Stream"

[[bin]]
name = "chronik-operator"
path = "src/main.rs"

[dependencies]
# Kubernetes
kube = { version = "5", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.29", features = ["v1_33"] }
schemars = "1"

# Async
tokio = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
toml = "0.8"

# HTTP client (for Chronik Admin API)
reqwest = { workspace = true }

# Kafka admin protocol (topics, SCRAM users, ACLs) and SASL/SCRAM login
kafka-protocol = { version = "0.18", default-features = false, features = ["client", "broker"] }
chronik-scram = { path = "../chronik-scram" }
bytes = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }

# CLI
clap = { workspace = true }

# Utilities
uuid = { workspace = true }
rand = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
