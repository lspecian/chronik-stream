[workspace]
resolver = "2"
members = [
    "crates/chronik-common",
    "crates/chronik-protocol",
    "crates/chronik-scram",
    "crates/chronik-storage",
    "crates/chronik-search",
    "crates/chronik-query",
    "crates/chronik-monitoring",
    "crates/chronik-config",
    "crates/chronik-server",
    "crates/chronik-wal",
    "crates/chronik-bench",
    "crates/chronik-raft",
    "crates/chronik-columnar",
    "crates/chronik-embeddings",
    "crates/chronik-operator",
    "crates/chronik-perf",
    "crates/chronik-memory",
    "crates/chronik-ontology",
    "crates/chronik-cli",
    # Integration tests. A member, not an exclusion — see tests/Cargo.toml for
    # why standing outside the workspace is what let them rot unnoticed.
    "tests",
    # NOTE (AM-1.7, AD-1): bindings/python deleted. Agent memory is now an HTTP
    # surface under /memory/v1/* (port 6092); any language with an HTTP client
    # has parity. Curl + Python examples live in examples/agent-memory/.
]

[workspace.package]
version = "2.20.6"
edition = "2021"
authors = ["Chronik Stream Contributors"]
license = "Apache-2.0"
repository = "https://github.com/chronik-stream/chronik-stream"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"

# Web framework
axum = "0.8"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
bytes = { version = "1.5", features = ["serde"] }
byteorder = "1.5"
bincode = "1.3"

# Search engine (MIT)
tantivy = "0.27"

# Storage
opendal = { version = "0.59", default-features = false, features = ["http-transport-reqwest", "executors-tokio", "layers-retry", "services-gcs", "services-azblob"] }
# Add vendored OpenSSL for musl builds
openssl = { version = "0.10", features = ["vendored"] }
flate2 = "1.0"
crc32fast = "1.3"
snap = "1.1"
lz4_flex = "0.11"

# Database
# sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }

# Consensus (v2.5.0+)
# Raft for metadata/leader election, WAL streaming for data replication
# Using vendored raft crate with prost 0.12 compatibility (see [patch] section)
raft = { version = "0.7", default-features = false, features = ["prost-codec"] }

# gRPC for Raft network layer (upgraded with vendored raft crate)
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"

# Logging for Raft
slog = "2.7"
slog-stdlog = "4.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = { version = "0.14", features = ["process"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utils
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
dashmap = "5.5"
parking_lot = "0.12"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Build dependencies
tonic-prost-build = "0.14"

# TLS for Kafka Protocol
tokio-rustls = "0.26"
rustls = "0.23"

# Testing
proptest = "1.4"
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3.8"
base64 = "0.21"
# SCRAM-SHA-256/512 (SASL): PBKDF2 key derivation, HMAC, digest, constant-time compare
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
subtle = "2.5"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
rdkafka = { version = "0.40", features = ["cmake-build", "ssl", "zstd"] }
reqwest = { version = "0.12", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "warn"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true  # Enable debug symbols for profiling

[profile.bench]
inherits = "release"

# Patch raft crates with vendored versions for prost 0.12 compatibility
[patch.crates-io]
raft = { path = "crates/raft" }
raft-proto = { path = "crates/raft-proto" }
# Tantivy fork: 0.27.0 plus fixes upstream has not merged yet. Branch
# `chronik` of github.com/lspecian/tantivy, pinned by rev; see
# docs/TANTIVY_FORK.md for what it carries and how to rebase it.
tantivy = { git = "https://github.com/lspecian/tantivy", rev = "ec4f46ff1e1fc9898e4da7b00be1cfd938dfd21e" }
tantivy-bitpacker = { git = "https://github.com/lspecian/tantivy", rev = "ec4f46ff1e1fc9898e4da7b00be1cfd938dfd21e" }
tantivy-columnar = { git = "https://github.com/lspecian/tantivy", rev = "ec4f46ff1e1fc9898e4da7b00be1cfd938dfd21e" }
tantivy-common = { git = "https://github.com/lspecian/tantivy", rev = "ec4f46ff1e1fc9898e4da7b00be1cfd938dfd21e" }
tantivy-query-grammar = { git = "https://github.com/lspecian/tantivy", rev = "ec4f46ff1e1fc9898e4da7b00be1cfd938dfd21e" }
tantivy-sstable = { git = "https://github.com/lspecian/tantivy", rev = "ec4f46ff1e1fc9898e4da7b00be1cfd938dfd21e" }
tantivy-stacker = { git = "https://github.com/lspecian/tantivy", rev = "ec4f46ff1e1fc9898e4da7b00be1cfd938dfd21e" }
tantivy-tokenizer-api = { git = "https://github.com/lspecian/tantivy", rev = "ec4f46ff1e1fc9898e4da7b00be1cfd938dfd21e" }
ownedbytes = { git = "https://github.com/lspecian/tantivy", rev = "ec4f46ff1e1fc9898e4da7b00be1cfd938dfd21e" }
