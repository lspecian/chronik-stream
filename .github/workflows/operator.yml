name: Operator CI

on:
  pull_request:
    paths:
      - 'crates/chronik-operator/**'
      - 'charts/chronik-operator/**'
      - '.github/workflows/operator.yml'
  push:
    branches: [main]
    paths:
      - 'crates/chronik-operator/**'
      - 'charts/chronik-operator/**'
      - '.github/workflows/operator.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libsasl2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-operator-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -p chronik-operator -- --check

      - name: Clippy
        run: cargo clippy -p chronik-operator --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p chronik-operator

      - name: Release build
        run: cargo build --release --bin chronik-operator

      - name: CRDs in the chart match the code
        run: |
          # The chart's crds/ are what actually reaches a cluster, and Helm only
          # applies them on first install — a stale file there is invisible
          # until someone sets a field the cluster then silently prunes.
          ./target/release/chronik-operator crd-gen > /tmp/crds-from-code.yaml
          csplit -s -z -f /tmp/crd- -b '%02d.yaml' /tmp/crds-from-code.yaml '/^---$/' '{*}'
          drift=0
          for f in /tmp/crd-*.yaml; do
            sed -i '1{/^---$/d}' "$f"
            name=$(grep -m1 '^  name:' "$f" | awk '{print $2}' | cut -d. -f1)
            if ! diff -u "charts/chronik-operator/crds/${name}.yaml" "$f"; then
              echo "::error::charts/chronik-operator/crds/${name}.yaml is stale — regenerate with 'chronik-operator crd-gen'"
              drift=1
            fi
          done
          exit $drift

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installed explicitly: the previous version of this job skipped both
      # steps when helm was absent and reported success, so it passed without
      # ever linting the chart.
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint charts/chronik-operator/

      - name: Helm template
        run: helm template test charts/chronik-operator/ > /dev/null
