name: CI

on:
  pull_request:
    branches: [ main ]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # ubuntu-latest moved to CMake 4, which refuses librdkafka 2.3.0's
  # `cmake_minimum_required(VERSION 3.2)` (bundled by rdkafka-sys 4.8, pulled in
  # by chronik-bench/perf/memory/ontology and the integration tests). Every PR
  # since v2.16.6 failed Check and Test on this, not on code. CMake 4 honours
  # this override; older CMake ignores it.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libsasl2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check
        run: cargo check --all-features --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libsasl2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      
      # Unit tests (lib + bins) across the workspace — fast fail-first signal.
      - name: Run unit tests
        run: cargo test --workspace --lib --bins

      # Integration / conformance suites live under each crate's tests/ dir and are
      # NOT covered by --lib --bins, so they previously rotted unnoticed (the protocol
      # wire-format suites, plus chronik-query/chronik-search/chronik-storage suites,
      # had all silently broken this way). Every crate's tests/ suite is now hermetic —
      # infra-coupled cases (live broker/cluster/model/API key) are #[ignore]-gated and
      # skipped here — so run them all to guard against regressions. No Docker required.
      - name: Run integration tests
        run: cargo test --workspace --tests

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libsasl2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: cargo build --release --bin chronik-server