[package]
name = "chronik-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# This package is a WORKSPACE MEMBER on purpose.
#
# It used to carry `[workspace]` of its own plus `exclude = ["tests"]` in the
# root manifest, which pinned it to an independent dependency set: `raft = "0.7"`
# from crates.io while the workspace vendors raft, `tonic = "0.12"` against the
# workspace's 0.11. Nothing tied it to the tree it tests, so it drifted until 24
# of 27 files no longer compiled — and because it was outside the workspace,
# `cargo test --workspace` never said so.
#
# Every dependency below is `workspace = true` for the same reason. A test suite
# that resolves its own versions is testing a different program.

[dependencies]

[dev-dependencies]
chronik-common = { path = "../crates/chronik-common" }
chronik-protocol = { path = "../crates/chronik-protocol" }
chronik-storage = { path = "../crates/chronik-storage" }
chronik-wal = { path = "../crates/chronik-wal" }
chronik-config = { path = "../crates/chronik-config" }

tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
byteorder = { workspace = true }
crc32fast = { workspace = true }
bincode = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

rdkafka = { workspace = true }
reqwest = { workspace = true }

# The WAL suites drive rdkafka's C library and read `log`-crate output from it.
base64 = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }

# Test targets are declared one at a time, never by glob, so a file that stops
# compiling fails the build here instead of quietly dropping out of coverage.

[[test]]
name = "canonical_crc"
path = "integration/canonical_crc_test.rs"

[[test]]
name = "batch_round_trip"
path = "integration/test_batch_round_trip.rs"

[[test]]
name = "vector_search"
path = "integration/vector_search_test.rs"

[[test]]
name = "admin_api"
path = "integration/admin_api_test.rs"

[[test]]
name = "partition_assignment_persistence"
path = "integration/partition_assignment_persistence.rs"

[[test]]
name = "consumer_groups"
path = "integration/consumer_groups.rs"

[[test]]
name = "kafka_protocol"
path = "integration/kafka_protocol.rs"

[[test]]
name = "wal_recovery"
path = "integration/wal_recovery_test.rs"

[[test]]
name = "wal_lifecycle"
path = "integration/wal_lifecycle_test.rs"

[[test]]
name = "data_flow"
path = "integration/data_flow.rs"


[[test]]
name = "sasl_enforcement"
path = "integration/sasl_enforcement_test.rs"

[[test]]
name = "acl_enforcement"
path = "integration/acl_enforcement_test.rs"
